name: QA Frontend

on:
  push:
    branches:
      - main
      - release/qa-main-2026-10-05
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest

    env:
      CI: true
      REACT_APP_API_URL: https://intranet.mercadolasestrellas.org/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --watchAll=false
